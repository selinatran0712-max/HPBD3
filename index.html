  <meta property="og:title" content="Happy Birthday MS RICH PEARL">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-primary: #EBF3F5;
      --bg-secondary: #D4E5ED;
      --accent-blue: #4A7C59;
      --text-dark: #2C3E50;
      --text-muted: #5A738E;
      --card-bg: rgba(255, 255, 255, 0.92);
      
      --gift-red-main: #B71C1C;
      --gift-red-dark: #7F0000;
      --gift-gold: #FFD700;

      --font-heading: 'Playfair Display', serif;
      --font-script: 'Great Vibes', cursive;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #EBF3F5 0%, #D4E5ED 100%);
      color: var(--text-dark);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 1.5rem 0;
    }

    #petals-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .petal {
      position: absolute;
      background: radial-gradient(circle, #ffffff 30%, #B2EBF2 90%);
      border-radius: 50% 0 50% 50%;
      opacity: 0.75;
      animation: floatPetal 9s linear infinite;
    }

    @keyframes floatPetal {
      0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 0.85;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.15;
      }
    }

    .wrapper {
      width: 100%;
      max-width: 680px;
      padding: 1rem;
      position: relative;
      z-index: 2;
    }

    .slide {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.95);
      transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      position: relative;
      pointer-events: auto;
    }

    /* SLIDE 1 */
    .slide-gift-container {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(160, 190, 205, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.9);
      max-width: 480px;
      margin: 0 auto;
    }

    .brand-title {
      font-family: var(--font-heading);
      letter-spacing: 3px;
      font-size: 1.2rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .gift-heading {
      font-family: var(--font-script);
      font-size: 3rem;
      color: var(--text-dark);
      margin-bottom: 2rem;
    }

    .gift-box-wrapper {
      margin: 2rem 0;
      cursor: pointer;
      display: inline-block;
    }

    .gift-box {
      width: 140px;
      height: 140px;
      position: relative;
      margin: 0 auto;
      transition: transform 0.3s ease;
    }

    .gift-box:hover {
      transform: scale(1.05) rotate(2deg);
    }

    .gift-body {
      width: 100%;
      height: 100px;
      background: linear-gradient(135deg, var(--gift-red-main), var(--gift-red-dark));
      border-radius: 10px;
      position: absolute;
      bottom: 0;
      box-shadow: 0 12px 25px rgba(183, 28, 28, 0.3);
    }

    .gift-lid {
      width: 110%;
      height: 35px;
      background: linear-gradient(135deg, #D32F2F, var(--gift-red-main));
      border-radius: 8px;
      position: absolute;
      top: 10px;
      left: -5%;
      z-index: 3;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.6s ease;
    }

    .ribbon-v {
      position: absolute;
      width: 24px;
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #FFA000);
      left: 50%;
      transform: translateX(-50%);
    }

    .ribbon-h {
      position: absolute;
      height: 24px;
      width: 100%;
      background: linear-gradient(180deg, #FFD700, #FFA000);
      top: 50%;
      transform: translateY(-50%);
    }

    .gift-bow {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 28px;
      z-index: 4;
    }

    .gift-bow::before, .gift-bow::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      border: 4px solid var(--gift-gold);
      border-radius: 50% 50% 0 50%;
      transform: rotate(45deg);
    }

    .gift-bow::after {
      right: 0;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
    }

    .gift-box.open .gift-lid {
      transform: translateY(-85px) rotate(-22deg);
    }

    .click-hint {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 1.2rem;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* SLIDE 2 */
    .wish-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 2.8rem 2.2rem;
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 18px 40px rgba(140, 175, 195, 0.35);
    }

    .wish-layout {
      display: flex;
      align-items: center;
      gap: 2.2rem;
    }

    /* Khung chứa ảnh hiển thị ổn định */
    .profile-photo-wrapper {
      flex: 0 0 220px;
      width: 220px;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      padding: 6px;
      background: linear-gradient(135deg, #ffffff, #B2D4C3);
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      margin: 0 auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }

    .wish-content-right {
      flex: 1;
      text-align: left;
    }

    .wish-banner {
      font-family: var(--font-script);
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      color: var(--text-dark);
      line-height: 1.1;
      margin-bottom: 0.2rem;
    }

    .recipient-name {
      font-family: var(--font-heading);
      font-size: 1.7rem;
      letter-spacing: 2.5px;
      color: #3B6047;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      font-weight: 700;
    }

    .wish-text {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    @media (max-width: 600px) {
      .wish-layout {
        flex-direction: column;
        text-align: center;
      }
      .wish-content-right {
        text-align: center;
      }
      .profile-photo-wrapper {
        flex: none;
        width: 190px;
      }
      .recipient-name {
        font-size: 1.4rem;
      }
    }

    /* SLIDE 3 */
    .invitation-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 45px rgba(140, 175, 195, 0.38);
    }

    .invitation-title {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      color: #3B6047;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
      font-weight: 700;
    }

    .invitation-subtitle {
      font-family: var(--font-script);
      font-size: 2.6rem;
      color: var(--text-dark);
      margin-bottom: 1.5rem;
    }

    .divider {
      width: 70px;
      height: 3px;
      background: #B2C8D2;
      margin: 0 auto 1.8rem auto;
      border-radius: 2px;
    }

    .event-info {
      background: rgba(255, 255, 255, 0.75);
      border-radius: 20px;
      padding: 1.8rem 1.5rem;
      margin-bottom: 1.8rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.03);
    }

    .event-info-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 1.2rem;
      font-size: 1.1rem;
      color: var(--text-dark);
    }

    .event-info-item:last-child {
      margin-bottom: 0;
    }

    .event-info-item i {
      color: #4A7C59;
      font-size: 1.3rem;
      width: 24px;
    }

    .venue-title {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--text-dark);
    }

    .venue-address {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .thank-you-note {
      font-family: var(--font-script);
      font-size: 1.8rem;
      color: #3B6047;
      margin-bottom: 1.8rem;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      cursor: pointer;
      flex: 1;
      border: none;
    }

    .btn-primary {
      background: #4A7C59;
      color: #FFFFFF;
      box-shadow: 0 5px 15px rgba(74, 124, 89, 0.35);
    }

    .btn-primary:hover {
      background: #3B6347;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(74, 124, 89, 0.45);
    }

    @media (max-width: 500px) {
      .invitation-card {
        padding: 2.2rem 1.4rem;
      }
      .thank-you-note {
        font-size: 1.5rem;
      }
    }

    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
  </style>
</head>
